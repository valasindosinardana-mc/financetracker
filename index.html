<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Finance Tracker</title>
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --text:#1D1D1F; --sub:#8E8E93; --faint:#C7C7CC; --sep:#E5E5EA;
    --blue:#007AFF; --blueBg:#E8F1FF; --green:#34C759; --greenBg:#E7F9EC; --red:#FF3B30; --redBg:#FFEBEA;
    --orange:#FF9500; --orangeBg:#FFF2E0; --purple:#AF52DE; --purpleBg:#F6EBFC;
    --teal:#30B0C7; --tealBg:#E5F6F9; --pink:#FF2D55; --pinkBg:#FFE7EC; --gray:#8E8E93; --grayBg:#EDEDF2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  header{padding:28px 20px 12px;}
  header h1{font-size:28px;font-weight:700;letter-spacing:-0.4px;margin:0;}
  main{flex:1;padding:0 16px 110px;overflow-y:auto;}
  .error-banner{margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:var(--redBg);color:var(--red);font-size:14px;display:flex;gap:8px;align-items:center;}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);margin-bottom:12px;}
  .card.flat{padding:0;}
  .hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,#232326,#0a0a0c);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-bottom:12px;position:relative;overflow:hidden;}
  .hero .glow{position:absolute;width:220px;height:220px;right:-80px;top:-100px;background:radial-gradient(circle,rgba(0,122,255,.25),transparent 70%);border-radius:50%;}
  .hero .label{font-size:12px;color:rgba(255,255,255,.55);position:relative;}
  .hero .amount{font-size:34px;font-weight:700;letter-spacing:-0.6px;margin-top:4px;position:relative;font-variant-numeric:tabular-nums;}
  .hero .delta{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;position:relative;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
  .badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .badge svg{width:17px;height:17px;}
  .subtle{font-size:12px;color:var(--sub);}
  .bignum{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
  .segmented{display:flex;padding:4px;border-radius:12px;background:var(--sep);margin-bottom:12px;gap:2px;}
  .segmented button{flex:1;padding:7px 4px;border:none;border-radius:9px;background:transparent;font-size:13px;font-weight:500;color:var(--sub);font-family:inherit;}
  .segmented button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .row-group{background:var(--card);border-radius:16px;overflow:hidden;}
  .tx-row, .asset-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:.5px solid var(--sep);min-height:60px;}
  .tx-row:last-child, .asset-row:last-child{border-bottom:none;}
  .tx-left, .asset-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:none;text-align:left;padding:0;font-family:inherit;}
  .tx-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tx-icon svg{width:15px;height:15px;}
  .row-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:8px;}
  .row-amount{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
  .del-btn{border:none;background:transparent;padding:6px;border-radius:50%;display:flex;}
  .del-btn svg{width:15px;height:15px;}
  .date-label{font-size:12px;font-weight:600;color:var(--sub);padding:0 4px;margin:14px 0 6px;}
  .empty{text-align:center;padding:56px 20px;color:var(--sub);}
  .empty p{margin:2px 0;font-size:14px;}
  .fab{position:fixed;right:max(20px, calc(50% - 210px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:28px;box-shadow:0 4px 14px rgba(0,122,255,.4);display:none;align-items:center;justify-content:center;z-index:30;}
  #tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;background:rgba(255,255,255,.94);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,10px);backdrop-filter:blur(10px);}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;background:none;border:none;font-family:inherit;color:var(--faint);}
  .tab-btn svg{width:22px;height:22px;}
  .tab-btn span{font-size:10.5px;font-weight:500;}
  .tab-btn.active{color:var(--blue);}
  .tab-btn.active span{font-weight:600;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;}
  .sheet-handle{display:flex;justify-content:center;padding:10px 0 4px;}
  .sheet-handle div{width:36px;height:5px;border-radius:3px;background:var(--faint);}
  .sheet-head{padding:0 20px 16px;display:flex;align-items:center;justify-content:space-between;}
  .sheet-head button{background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;font-family:inherit;}
  .sheet-head h2{font-size:16px;font-weight:600;margin:0;}
  .sheet-body{padding:0 16px calc(32px + env(safe-area-inset-bottom,0px));}
  .form-group{background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden;}
  .form-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:46px;border-bottom:.5px solid var(--sep);gap:12px;}
  .form-row:last-child{border-bottom:none;}
  .form-row label{font-size:15px;flex-shrink:0;}
  .form-row input, .form-row select{flex:1;min-width:0;text-align:right;background:transparent;border:none;outline:none;color:var(--sub);font-size:15px;padding:10px 0;font-family:inherit;}
  .form-row select{flex:0 1 auto;margin-left:auto;max-width:62%;direction:rtl;}
  .form-row select option{direction:ltr;}
  .form-row input[type="date"]{flex:0 1 auto;margin-left:auto;max-width:62%;text-align:right;}
  .hint{font-size:12px;color:var(--sub);padding:0 4px;margin:-8px 0 16px;}
  .hint.warn{color:var(--red);}
  .save-btn{width:100%;padding:14px;border-radius:16px;font-weight:600;font-size:15px;background:var(--blue);color:#fff;border:none;font-family:inherit;}
  .type-toggle{display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--sep);margin-bottom:16px;}
  .type-toggle button{flex:1;padding:10px 4px;border:none;border-radius:9px;font-weight:500;font-size:14px;font-family:inherit;background:transparent;color:var(--sub);}
  .type-toggle button.active-expense{background:var(--redBg);color:var(--red);}
  .type-toggle button.active-income{background:var(--greenBg);color:var(--green);}
  canvas{width:100%;display:block;}
  .cat-header{display:flex;justify-content:space-between;padding:0 4px;margin-bottom:6px;}
  .cat-header span:first-child{font-size:12px;font-weight:600;color:var(--sub);}
  .cat-header span:last-child{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
  .progress-track{width:100%;height:6px;border-radius:3px;background:var(--sep);margin-top:4px;}
  .progress-fill{height:6px;border-radius:3px;}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--sub);font-size:14px;flex-direction:column;gap:8px;}
  datalist{display:none;}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="pageTitle">Overview</h1></header>
  <div id="errorBanner" class="error-banner" style="display:none"></div>
  <main id="content"></main>
  <button id="fab" class="fab">+</button>
  <nav id="tabbar"></nav>
</div>
<div id="sheetOverlay" class="sheet-overlay"><div id="sheet" class="sheet"></div></div>

<script>
/* ---------- storage ---------- */
const LS_TX = "ft_transactions", LS_ASSETS = "ft_assets";
let storageAvailable = true;
try{ localStorage.setItem("__test__","1"); localStorage.removeItem("__test__"); }catch(e){ storageAvailable = false; }
function loadTx(){ try{ return JSON.parse(localStorage.getItem(LS_TX)||"[]"); }catch(e){ return []; } }
function loadAssets(){ try{ return JSON.parse(localStorage.getItem(LS_ASSETS)||"[]"); }catch(e){ return []; } }
function saveTx(list){ transactions = list; try{ localStorage.setItem(LS_TX, JSON.stringify(list)); }catch(e){ flashError("Storage is blocked in this view — data won't be saved. Open this file in Safari directly."); } }
function saveAssets(list){ assets = list; try{ localStorage.setItem(LS_ASSETS, JSON.stringify(list)); }catch(e){ flashError("Storage is blocked in this view — data won't be saved. Open this file in Safari directly."); } }

let transactions = loadTx();
let assets = loadAssets();
let tab = "dashboard";
let period = "month";
let confirmDeleteId = null;
let confirmTimer = null;
let editingTx = null;
let editingAsset = null;

/* ---------- constants ---------- */
const TX_CATEGORIES = {
  income: ["Salary","Bonus","Freelance","Other"],
  expense: ["Food","Transport","Shopping","Bills","Entertainment","Health","Other"],
};
const ASSET_CATEGORIES = ["Bank","Cash"];
const ASSET_COLOR = { Bank:"var(--blue)", Cash:"var(--green)" };

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); const l=new Date(d.getTime()-d.getTimezoneOffset()*60000); return l.toISOString().slice(0,10); }
function esc(s){ const d=document.createElement("div"); d.textContent = s==null? "": String(s); return d.innerHTML; }
function formatRp(n){ const v=Number(n)||0; const sign=v<0?"-":""; return sign+"Rp"+Math.round(Math.abs(v)).toLocaleString("en-US"); }
function formatRpShort(n){ const v=Number(n)||0; const abs=Math.abs(v); const sign=v<0?"-":"";
  if(abs>=1e9) return sign+"Rp"+(abs/1e9).toFixed(1).replace(/\.0$/,"")+"B";
  if(abs>=1e6) return sign+"Rp"+(abs/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(abs>=1e3) return sign+"Rp"+(abs/1e3).toFixed(0)+"K";
  return formatRp(v);
}
function formatThousands(digits){ if(!digits) return ""; return Number(digits).toLocaleString("en-US"); }
function onlyDigits(s){ return (s||"").replace(/\D/g,""); }
function dateLabel(dateStr){ try{ return new Date(dateStr+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }catch(e){ return dateStr; } }
function monthLabel(key){ const [y,m]=key.split("-"); return new Date(Number(y),Number(m)-1,1).toLocaleDateString("en-US",{month:"short"}); }
function last6MonthKeys(){ const arr=[]; const now=new Date(); for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); } return arr; }
function flashError(msg){ const b=document.getElementById("errorBanner"); b.textContent = msg; b.style.display="flex"; clearTimeout(flashError._t); flashError._t=setTimeout(()=>{ b.style.display="none"; }, 3000); }

/* ---------- icons (inline svg) ---------- */
const ICONS = {
  wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1"/><path d="M18 12a2 2 0 0 0 0 4h3v-4Z"/></svg>`,
  chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>`,
  bank: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 18 0"/><path d="M3 10h18L12 3Z"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8"/></svg>`,
  up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>`,
  down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 9v8h8"/></svg>`,
  trendUp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>`,
};

/* ---------- financial logic ---------- */
function adjustAsset(list, accountId, delta){
  if(!accountId || !delta) return list;
  return list.map(a => a.id===accountId ? {...a, amount: a.amount+delta} : a);
}
function upsertTx(draft){
  const amt = Math.abs(Number(draft.amount))||0;
  if(!draft.date || !draft.category || amt<=0 || !draft.accountId){
    flashError("Please fill in date, category, amount, and select an account.");
    return;
  }
  let nextAssets = assets;
  if(editingTx && editingTx.accountId){
    const oldDelta = editingTx.type==="income" ? editingTx.amount : -editingTx.amount;
    nextAssets = adjustAsset(nextAssets, editingTx.accountId, -oldDelta);
  }
  if(draft.accountId){
    const newDelta = draft.type==="income" ? amt : -amt;
    nextAssets = adjustAsset(nextAssets, draft.accountId, newDelta);
  }
  if(nextAssets !== assets) saveAssets(nextAssets);
  const finalTx = {...draft, amount:amt, accountId: draft.accountId||null};
  if(editingTx) saveTx(transactions.map(t => t.id===editingTx.id ? {...finalTx, id:editingTx.id} : t));
  else saveTx([...transactions, {...finalTx, id:uid()}]);
  closeSheet(); render();
}
function deleteTx(id){
  const tx = transactions.find(t => t.id===id);
  if(tx && tx.accountId){
    const delta = tx.type==="income" ? tx.amount : -tx.amount;
    saveAssets(adjustAsset(assets, tx.accountId, -delta));
  }
  saveTx(transactions.filter(t => t.id!==id));
  render();
}
function upsertAsset(draft){
  const amt = Number(draft.amount)||0;
  if(!draft.category || !draft.name || amt<0){ flashError("Please fill in category, name, and value."); return; }
  if(editingAsset) saveAssets(assets.map(a => a.id===editingAsset.id ? {...draft, amount:amt} : a));
  else saveAssets([...assets, {...draft, amount:amt, id:uid()}]);
  closeSheet(); render();
}
function deleteAsset(id){ saveAssets(assets.filter(a => a.id!==id)); render(); }

function handleConfirmDelete(id, kind){
  if(confirmDeleteId === id){
    if(kind==="tx") deleteTx(id); else deleteAsset(id);
    confirmDeleteId = null; clearTimeout(confirmTimer);
  } else {
    confirmDeleteId = id; clearTimeout(confirmTimer);
    confirmTimer = setTimeout(()=>{ confirmDeleteId=null; render(); }, 2500);
    render();
  }
}

/* ---------- derived data ---------- */
function getFilteredTx(){
  const today = todayStr(); const curMonth = today.slice(0,7); const curYear = today.slice(0,4);
  let list = transactions;
  if(period==="day") list = list.filter(t => t.date===today);
  else if(period==="month") list = list.filter(t => t.date.slice(0,7)===curMonth);
  else if(period==="year") list = list.filter(t => t.date.slice(0,4)===curYear);
  return [...list].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
}
function getAssetTotals(){
  const byCat = {}; ASSET_CATEGORIES.forEach(c=> byCat[c]=0);
  let total = 0;
  assets.forEach(a=>{ byCat[a.category]=(byCat[a.category]||0)+a.amount; total+=a.amount; });
  return { byCat, total };
}
function getMonthNet(){
  const curMonth = todayStr().slice(0,7);
  let income=0, expense=0;
  transactions.forEach(t=>{ if(t.date.slice(0,7)===curMonth){ if(t.type==="income") income+=t.amount; else expense+=t.amount; } });
  return income-expense;
}
function getMonthChartData(){
  const keys = last6MonthKeys();
  return keys.map(k=>{
    let income=0, expense=0;
    transactions.forEach(t=>{ if(t.date.slice(0,7)===k){ if(t.type==="income") income+=t.amount; else expense+=t.amount; } });
    return { month: monthLabel(k), income, expense };
  });
}

/* ---------- render: shell ---------- */
function render(){
  document.getElementById("pageTitle").textContent = tab==="dashboard"?"Overview":tab==="cashflow"?"Cashflow":"Accounts";
  renderTabbar();
  const fab = document.getElementById("fab");
  fab.style.display = (tab==="cashflow"||tab==="assets") ? "flex" : "none";
  fab.onclick = () => tab==="cashflow" ? openTxSheet(null) : openAssetSheet(null);
  const content = document.getElementById("content");
  if(tab==="dashboard") content.innerHTML = renderDashboard();
  else if(tab==="cashflow") content.innerHTML = renderCashflow();
  else content.innerHTML = renderAssets();
  attachContentHandlers();
  if(tab==="dashboard") drawChart();
}
function renderTabbar(){
  const items = [
    {id:"dashboard", label:"Overview", icon:ICONS.wallet},
    {id:"cashflow", label:"Cashflow", icon:ICONS.chart},
    {id:"assets", label:"Accounts", icon:ICONS.bank},
  ];
  document.getElementById("tabbar").innerHTML = items.map(it => `
    <button class="tab-btn ${tab===it.id?"active":""}" data-tab="${it.id}">${it.icon}<span>${it.label}</span></button>
  `).join("");
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.onclick = () => { tab = btn.getAttribute("data-tab"); render(); };
  });
}

/* ---------- render: dashboard ---------- */
function renderDashboard(){
  const { byCat, total } = getAssetTotals();
  const bankTotal = byCat["Bank"]||0;
  const cashTotal = byCat["Cash"]||0;
  const monthNet = getMonthNet();
  const hasTx = transactions.length>0;
  const hasAssets = assets.length>0;
  const keys = last6MonthKeys();

  let html = `
  <div class="hero">
    <div class="glow"></div>
    <div class="label">Total Balance</div>
    <div class="amount">${formatRp(total)}</div>
    <div class="delta">
      <span style="color:${monthNet>=0?'#34C759':'#FF453A'}">${monthNet>=0?ICONS.up:ICONS.down}</span>
      <span style="color:${monthNet>=0?'#34C759':'#FF453A'};font-weight:500;">${formatRp(Math.abs(monthNet))}</span>
      <span style="color:rgba(255,255,255,.45)">this month</span>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="badge" style="background:var(--blueBg);color:var(--blue)">${ICONS.bank}</div>
      <div class="subtle">Total Bank</div>
      <div class="bignum">${formatRpShort(bankTotal)}</div>
    </div>
    <div class="card">
      <div class="badge" style="background:var(--greenBg);color:var(--green)">${ICONS.wallet}</div>
      <div class="subtle">Total Cash</div>
      <div class="bignum">${formatRpShort(cashTotal)}</div>
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-size:15px;font-weight:600;">Cashflow · 6 Months</span>
      <span class="subtle">${monthLabel(keys[0])}–${monthLabel(keys[5])}</span>
    </div>
    ${hasTx ? `<canvas id="chartCanvas" height="160"></canvas>` : `<p class="subtle" style="text-align:center;padding:24px 0;">No transactions yet. Add one from the Cashflow tab.</p>`}
  </div>`;

  if(hasAssets){
    const rows = ASSET_CATEGORIES.filter(c => byCat[c]>0).map(c=>{
      const pct = total ? (byCat[c]/total*100) : 0;
      return `<div style="margin-bottom:10px;">
        <div class="cat-header" style="margin-bottom:2px;"><span style="color:var(--text)">${c}</span><span>${formatRpShort(byCat[c])} · ${pct.toFixed(0)}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${ASSET_COLOR[c]}"></div></div>
      </div>`;
    }).join("");
    html += `<div class="card"><div style="font-size:15px;font-weight:600;margin-bottom:8px;">Account Breakdown</div>${rows}</div>`;
  }
  return html;
}
function drawChart(){
  const canvas = document.getElementById("chartCanvas");
  if(!canvas) return;
  const data = getMonthChartData();
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth || 300, h = 160;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const padBottom = 20, padTop = 6, chartH = h-padBottom-padTop;
  const groupW = w/data.length;
  ctx.font = "11px -apple-system,sans-serif"; ctx.fillStyle = "#8E8E93"; ctx.textAlign="center";
  data.forEach((d,i)=>{
    const cx = groupW*i + groupW/2;
    const bw = Math.min(14, groupW*0.22);
    const gap = 4;
    const incH = (d.income/max)*chartH, expH = (d.expense/max)*chartH;
    ctx.fillStyle = "#34C759";
    ctx.beginPath(); roundRectTop(ctx, cx-bw-gap/2, padTop+chartH-incH, bw, incH, 3); ctx.fill();
    ctx.fillStyle = "#FF3B30";
    ctx.beginPath(); roundRectTop(ctx, cx+gap/2, padTop+chartH-expH, bw, expH, 3); ctx.fill();
    ctx.fillStyle = "#8E8E93";
    ctx.fillText(d.month, cx, h-4);
  });
}
function roundRectTop(ctx,x,y,w,h,r){
  if(h<=0){ return; }
  const rr = Math.min(r, w/2, h);
  ctx.moveTo(x, y+h);
  ctx.lineTo(x, y+rr);
  ctx.arcTo(x, y, x+rr, y, rr);
  ctx.lineTo(x+w-rr, y);
  ctx.arcTo(x+w, y, x+w, y+rr, rr);
  ctx.lineTo(x+w, y+h);
  ctx.closePath();
}

function getAvailableMonths(){
  const set = new Set(transactions.map(t => t.date.slice(0,7)));
  set.add(todayStr().slice(0,7));
  return [...set].sort((a,b)=> a<b?1:-1);
}
function csvEscape(v){
  const s = String(v==null?"":v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportMonthCSV(monthKey){
  const assetMap = Object.fromEntries(assets.map(a=>[a.id,a]));
  const rows = transactions
    .filter(t => t.date.slice(0,7)===monthKey)
    .sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  let income=0, expense=0;
  const lines = [["Date","Type","Category","Account","Amount","Note"].map(csvEscape).join(",")];
  rows.forEach(t=>{
    if(t.type==="income") income+=t.amount; else expense+=t.amount;
    lines.push([t.date, t.type==="income"?"Income":"Expense", t.category, assetMap[t.accountId]?assetMap[t.accountId].name:"", t.amount, t.note||""].map(csvEscape).join(","));
  });
  lines.push("");
  lines.push(["Total Income","","","",income,""].map(csvEscape).join(","));
  lines.push(["Total Expense","","","",expense,""].map(csvEscape).join(","));
  lines.push(["Net","","","",income-expense,""].map(csvEscape).join(","));

  const blob = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `cashflow-${monthKey}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function openExportSheet(){
  const months = getAvailableMonths();
  let selected = months[0];
  renderExportSheet(selected, months);
  document.getElementById("sheetOverlay").style.display = "flex";
}
function renderExportSheet(selected, months){
  const rows = transactions.filter(t => t.date.slice(0,7)===selected);
  let income=0, expense=0;
  rows.forEach(t => t.type==="income" ? income+=t.amount : expense+=t.amount);
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `
    <div class="sheet-handle"><div></div></div>
    <div class="sheet-head"><button id="cancelBtn">Cancel</button><h2>Export Month</h2><div style="width:40px;"></div></div>
    <div class="sheet-body">
      <div class="form-group">
        <div class="form-row" style="border-bottom:none;">
          <label>Month</label>
          <select id="exportMonth">
            ${months.map(m => `<option value="${m}" ${m===selected?"selected":""}>${monthLabel(m)} ${m.slice(0,4)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="grid3">
        <div class="card" style="padding:12px;"><div class="subtle">In</div><div class="bignum" style="font-size:15px;color:var(--green)">${formatRpShort(income)}</div></div>
        <div class="card" style="padding:12px;"><div class="subtle">Out</div><div class="bignum" style="font-size:15px;color:var(--red)">${formatRpShort(expense)}</div></div>
        <div class="card" style="padding:12px;"><div class="subtle">Net</div><div class="bignum" style="font-size:15px;">${formatRpShort(income-expense)}</div></div>
      </div>
      <p class="subtle" style="padding:0 4px;margin:0 0 16px;">${rows.length} transaction${rows.length===1?"":"s"} will be exported as a CSV file (opens in Excel, Sheets, Numbers).</p>
      <button class="save-btn" id="doExportBtn">Export CSV</button>
    </div>
  `;
  document.getElementById("cancelBtn").onclick = closeSheet;
  document.getElementById("exportMonth").onchange = e => renderExportSheet(e.target.value, months);
  document.getElementById("doExportBtn").onclick = () => { exportMonthCSV(document.getElementById("exportMonth").value); closeSheet(); };
}

/* ---------- render: cashflow ---------- */
function renderCashflow(){
  const filtered = getFilteredTx();
  let income=0, expense=0;
  filtered.forEach(t=> t.type==="income" ? income+=t.amount : expense+=t.amount);
  const net = income-expense;
  const grouped = {};
  filtered.forEach(t=>{ (grouped[t.date]=grouped[t.date]||[]).push(t); });
  const dateKeys = Object.keys(grouped).sort((a,b)=> a<b?1:-1);
  const assetMap = Object.fromEntries(assets.map(a=>[a.id,a]));

  const periods = [["day","Daily"],["month","Monthly"],["year","Yearly"],["all","All"]];
  let html = `<div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
    <button id="exportBtn" style="display:flex;align-items:center;gap:5px;background:var(--card);border:none;padding:7px 12px;border-radius:10px;color:var(--blue);font-size:13px;font-weight:500;font-family:inherit;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);">
      <span style="width:14px;height:14px;display:flex;">${ICONS.download}</span> Export
    </button>
  </div>`;
  html += `<div class="segmented">${periods.map(([v,l])=>`<button class="${period===v?'active':''}" data-period="${v}">${l}</button>`).join("")}</div>`;

  html += `<div class="grid3">
    <div class="card" style="padding:12px;"><div class="subtle">In</div><div class="bignum" style="font-size:15px;color:var(--green)">${formatRpShort(income)}</div></div>
    <div class="card" style="padding:12px;"><div class="subtle">Out</div><div class="bignum" style="font-size:15px;color:var(--red)">${formatRpShort(expense)}</div></div>
    <div class="card" style="padding:12px;"><div class="subtle">Net</div><div class="bignum" style="font-size:15px;color:${net>=0?'var(--blue)':'var(--red)'}">${formatRpShort(net)}</div></div>
  </div>`;

  if(dateKeys.length===0){
    html += `<div class="empty"><p>No entries for this period.</p><p>Tap + to add one.</p></div>`;
  } else {
    dateKeys.forEach(date=>{
      html += `<div class="date-label">${dateLabel(date)}</div><div class="row-group">`;
      grouped[date].forEach(t=>{
        const acc = assetMap[t.accountId];
        const subParts = [acc?acc.name:null, t.note].filter(Boolean).join(" · ");
        html += `<div class="tx-row">
          <button class="tx-left" data-edit-tx="${t.id}">
            <span class="tx-icon" style="background:${t.type==='income'?'var(--greenBg)':'var(--redBg)'};color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?ICONS.up:ICONS.down}</span>
            <span style="min-width:0;">
              <div class="row-title">${esc(t.category)}</div>
              ${subParts?`<div class="row-sub">${esc(subParts)}</div>`:""}
            </span>
          </button>
          <div class="row-right">
            <span class="row-amount" style="color:${t.type==='income'?'var(--green)':'var(--red)'}">${t.type==='income'?'+':'-'}${formatRpShort(t.amount)}</span>
            <button class="del-btn" data-del-tx="${t.id}" style="background:${confirmDeleteId===t.id?'var(--redBg)':'transparent'}"><span style="color:${confirmDeleteId===t.id?'var(--red)':'var(--faint)'}">${ICONS.trash}</span></button>
          </div>
        </div>`;
      });
      html += `</div>`;
    });
  }
  return html;
}

/* ---------- render: assets ---------- */
function renderAssets(){
  const { byCat, total } = getAssetTotals();
  const groupedAssets = {}; ASSET_CATEGORIES.forEach(c=> groupedAssets[c]=[]);
  assets.forEach(a=> (groupedAssets[a.category]=groupedAssets[a.category]||[]).push(a));
  const hasAny = assets.length>0;

  let html = `<div class="hero"><div class="label">Total Balance</div><div class="amount" style="font-size:30px;">${formatRp(total)}</div></div>`;

  if(!hasAny){
    html += `<div class="empty"><p>No accounts added yet.</p><p>Tap + to add a bank or cash balance.</p></div>`;
  }

  ASSET_CATEGORIES.forEach(cat=>{
    const items = groupedAssets[cat];
    if(!items.length) return;
    html += `<div class="cat-header"><span>${cat.toUpperCase()}</span><span style="color:${ASSET_COLOR[cat]}">${formatRp(byCat[cat])}</span></div><div class="row-group" style="margin-bottom:12px;">`;
    items.forEach(a=>{
      html += `<div class="asset-row">
        <button class="asset-left" data-edit-asset="${a.id}">
          <span style="width:8px;height:8px;border-radius:50%;background:${ASSET_COLOR[cat]};flex-shrink:0;"></span>
          <span style="min-width:0;">
            <div class="row-title">${esc(a.name)}</div>
            ${a.note?`<div class="row-sub">${esc(a.note)}</div>`:""}
          </span>
        </button>
        <div class="row-right">
          <span class="row-amount">${formatRpShort(a.amount)}</span>
          <button class="del-btn" data-del-asset="${a.id}" style="background:${confirmDeleteId===a.id?'var(--redBg)':'transparent'}"><span style="color:${confirmDeleteId===a.id?'var(--red)':'var(--faint)'}">${ICONS.trash}</span></button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

/* ---------- content event delegation ---------- */
function attachContentHandlers(){
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.onclick = openExportSheet;
  document.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = () => { period = btn.getAttribute("data-period"); render(); };
  });
  document.querySelectorAll("[data-edit-tx]").forEach(btn=>{
    btn.onclick = () => { const id=btn.getAttribute("data-edit-tx"); openTxSheet(transactions.find(t=>t.id===id)); };
  });
  document.querySelectorAll("[data-del-tx]").forEach(btn=>{
    btn.onclick = (e) => { e.stopPropagation(); handleConfirmDelete(btn.getAttribute("data-del-tx"), "tx"); };
  });
  document.querySelectorAll("[data-edit-asset]").forEach(btn=>{
    btn.onclick = () => { const id=btn.getAttribute("data-edit-asset"); openAssetSheet(assets.find(a=>a.id===id)); };
  });
  document.querySelectorAll("[data-del-asset]").forEach(btn=>{
    btn.onclick = (e) => { e.stopPropagation(); handleConfirmDelete(btn.getAttribute("data-del-asset"), "asset"); };
  });
}

/* ---------- sheets ---------- */
function closeSheet(){
  document.getElementById("sheetOverlay").style.display = "none";
  editingTx = null; editingAsset = null;
}
function openTxSheet(tx){
  editingTx = tx || null;
  const type0 = tx?.type || "expense";
  const state = { type:type0, date: tx?.date||todayStr(), category: tx?.category||"", amount: tx?tString(tx.amount):"", note: tx?.note||"", accountId: tx?.accountId||"" };
  renderTxSheet(state);
  document.getElementById("sheetOverlay").style.display = "flex";
}
function tString(n){ return n?String(n):""; }

function renderTxSheet(state){
  const sortedAssets = [...assets].sort((a,b)=> a.category===b.category ? a.name.localeCompare(b.name) : (a.category==="Bank"?-1:1));
  const selected = sortedAssets.find(a=>a.id===state.accountId);
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `
    <div class="sheet-handle"><div></div></div>
    <div class="sheet-head"><button id="cancelBtn">Cancel</button><h2>${editingTx?"Edit Transaction":"New Transaction"}</h2><div style="width:40px;"></div></div>
    <div class="sheet-body">
      <div class="type-toggle">
        <button id="btnExpense" class="${state.type==='expense'?'active-expense':''}">Expense</button>
        <button id="btnIncome" class="${state.type==='income'?'active-income':''}">Income</button>
      </div>
      <div class="form-group">
        <div class="form-row"><label>Date</label><input type="date" id="fDate" value="${state.date}"></div>
        <div class="form-row"><label>Category</label><input type="text" id="fCategory" list="catList" placeholder="Select or type" value="${esc(state.category)}"></div>
        <datalist id="catList">${TX_CATEGORIES[state.type].map(c=>`<option value="${c}">`).join("")}</datalist>
        <div class="form-row"><label>Amount</label><input type="text" inputmode="numeric" id="fAmount" placeholder="0" value="${formatThousands(state.amount)}"></div>
        <div class="form-row" style="border-bottom:none;"><label>Note</label><input type="text" id="fNote" placeholder="Optional" value="${esc(state.note)}"></div>
      </div>
      <div class="form-group">
        <div class="form-row" style="border-bottom:none;">
          <label>Account</label>
          <select id="fAccount">
            <option value="" ${!state.accountId?"selected":""} disabled>Select account</option>
            ${sortedAssets.map(a=>`<option value="${a.id}" ${a.id===state.accountId?"selected":""}>${esc(a.name)} (${a.category})</option>`).join("")}
          </select>
        </div>
      </div>
      ${sortedAssets.length===0
        ? `<p class="hint warn">Add an account in the Accounts tab first — a transaction must be linked to one.</p>`
        : (selected ? `<p class="hint" id="acctHint">The ${esc(selected.name)} balance will automatically ${state.type==='income'?'increase':'decrease'} by this amount.</p>` : `<p class="hint" id="acctHint"></p>`)}
      <button class="save-btn" id="saveTxBtn">Save</button>
    </div>
  `;
  document.getElementById("cancelBtn").onclick = closeSheet;
  document.getElementById("btnExpense").onclick = () => { state.type="expense"; state.category=""; renderTxSheet(state); };
  document.getElementById("btnIncome").onclick = () => { state.type="income"; state.category=""; renderTxSheet(state); };
  document.getElementById("fDate").oninput = e => state.date = e.target.value;
  document.getElementById("fCategory").oninput = e => state.category = e.target.value;
  document.getElementById("fNote").oninput = e => state.note = e.target.value;
  const amountEl = document.getElementById("fAmount");
  amountEl.oninput = e => { state.amount = onlyDigits(e.target.value); const pos=e.target.value.length; e.target.value = formatThousands(state.amount); };
  document.getElementById("fAccount").onchange = e => { state.accountId = e.target.value; renderTxSheet(state); };
  document.getElementById("saveTxBtn").onclick = () => upsertTx({ id: editingTx?editingTx.id:undefined, type:state.type, date:state.date, category:state.category.trim(), amount:state.amount, note:state.note.trim(), accountId: state.accountId||null });
}

function openAssetSheet(asset){
  editingAsset = asset || null;
  const state = { category: asset?.category||"Bank", name: asset?.name||"", amount: asset?tString(asset.amount):"", note: asset?.note||"" };
  renderAssetSheet(state);
  document.getElementById("sheetOverlay").style.display = "flex";
}
function renderAssetSheet(state){
  const placeholders = { Bank:"e.g. BCA", Cash:"e.g. Cash on hand" };
  const sheet = document.getElementById("sheet");
  sheet.innerHTML = `
    <div class="sheet-handle"><div></div></div>
    <div class="sheet-head"><button id="cancelBtn">Cancel</button><h2>${editingAsset?"Edit Account":"New Account"}</h2><div style="width:40px;"></div></div>
    <div class="sheet-body">
      <div class="form-group">
        <div class="form-row"><label>Type</label>
          <select id="aCategory">${ASSET_CATEGORIES.map(c=>`<option value="${c}" ${c===state.category?"selected":""}>${c}</option>`).join("")}</select>
        </div>
        <div class="form-row"><label>Name</label><input type="text" id="aName" placeholder="${placeholders[state.category]}" value="${esc(state.name)}"></div>
        <div class="form-row"><label>Balance</label><input type="text" inputmode="numeric" id="aAmount" placeholder="0" value="${formatThousands(state.amount)}"></div>
        <div class="form-row" style="border-bottom:none;"><label>Note</label><input type="text" id="aNote" placeholder="Optional" value="${esc(state.note)}"></div>
      </div>
      <button class="save-btn" id="saveAssetBtn">Save</button>
    </div>
  `;
  document.getElementById("cancelBtn").onclick = closeSheet;
  document.getElementById("aCategory").onchange = e => { state.category = e.target.value; renderAssetSheet(state); };
  document.getElementById("aName").oninput = e => state.name = e.target.value;
  document.getElementById("aNote").oninput = e => state.note = e.target.value;
  document.getElementById("aAmount").oninput = e => { state.amount = onlyDigits(e.target.value); e.target.value = formatThousands(state.amount); };
  document.getElementById("saveAssetBtn").onclick = () => upsertAsset({ id: editingAsset?editingAsset.id:undefined, category:state.category, name:state.name.trim(), amount:state.amount, note:state.note.trim() });
}

/* ---------- boot ---------- */
window.onerror = function(msg, src, line, col, err){
  document.getElementById("content").innerHTML =
    `<div class="card" style="margin-top:16px;"><div style="font-weight:600;margin-bottom:6px;">Something went wrong</div><div class="subtle" style="word-break:break-word;">${esc(msg)} (line ${line})</div></div>`;
  return true;
};
try{
  if(!storageAvailable) flashError("Storage is blocked in this view. Open this file directly in Safari (not a preview) so your data can be saved.");
  render();
}catch(e){
  document.getElementById("content").innerHTML =
    `<div class="card" style="margin-top:16px;"><div style="font-weight:600;margin-bottom:6px;">Something went wrong</div><div class="subtle" style="word-break:break-word;">${esc(e.message)}</div></div>`;
}
</script>
