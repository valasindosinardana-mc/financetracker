<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Finance Tracker</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="theme-color" content="#0a0a0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Finance" />
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --text:#1D1D1F; --sub:#8E8E93; --faint:#C7C7CC; --sep:#E5E5EA;
    --blue:#007AFF; --blueBg:#E8F1FF; --green:#34C759; --greenBg:#E7F9EC; --red:#FF3B30; --redBg:#FFEBEA;
    --orange:#FF9500; --orangeBg:#FFF2E0; --purple:#AF52DE; --purpleBg:#F6EBFC;
    --teal:#30B0C7; --tealBg:#E5F6F9; --pink:#FF2D55; --pinkBg:#FFE7EC; --gray:#8E8E93; --grayBg:#EDEDF2;
    --tabbar-bg:rgba(255,255,255,.94);
    --picker-bg:rgba(255,255,255,.72);
    --sep-translucent:rgba(60,60,67,.18);
  }
  html.dark{
    --bg:#000000; --card:#1C1C1E; --text:#F2F2F7; --sub:#98989D; --faint:#48484A; --sep:#38383A;
    --blue:#0A84FF; --blueBg:#132A44; --green:#30D158; --greenBg:#132A1B; --red:#FF453A; --redBg:#3A1210;
    --orange:#FF9F0A; --orangeBg:#3A2705; --purple:#BF5AF2; --purpleBg:#2B1233;
    --teal:#40C8E0; --tealBg:#0E2A30; --pink:#FF375F; --pinkBg:#330E17; --gray:#98989D; --grayBg:#242426;
    --tabbar-bg:rgba(28,28,30,.92);
    --picker-bg:rgba(40,40,42,.72);
    --sep-translucent:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);transition:background-color .2s ease;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  header{padding:calc(20px + env(safe-area-inset-top, 0px)) 20px 12px;}
  header h1{font-size:28px;font-weight:700;letter-spacing:-0.4px;margin:0;}
  .eye-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);flex-shrink:0;}
  .eye-btn svg{width:18px;height:18px;}
  main{flex:1;padding:0 16px 110px;overflow-y:auto;}
  .error-banner{margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:var(--redBg);color:var(--red);font-size:14px;display:flex;gap:8px;align-items:center;}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);margin-bottom:12px;}
  html.dark .card{box-shadow:0 0 0 1px rgba(255,255,255,.06);}
  .card.flat{padding:0;}
  .hero{border-radius:24px;padding:20px;background:linear-gradient(135deg,#232326,#0a0a0c);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-bottom:12px;position:relative;overflow:hidden;}
  .hero .glow{position:absolute;width:220px;height:220px;right:-80px;top:-100px;background:radial-gradient(circle,rgba(0,122,255,.25),transparent 70%);border-radius:50%;}
  .hero .label{font-size:12px;color:rgba(255,255,255,.55);position:relative;}
  .hero .amount{font-size:34px;font-weight:700;letter-spacing:-0.6px;margin-top:4px;position:relative;font-variant-numeric:tabular-nums;}
  .hero .delta{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;position:relative;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;}
  .badge{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .badge svg{width:17px;height:17px;}
  .subtle{font-size:12px;color:var(--sub);}
  .bignum{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
  .segmented{display:flex;padding:4px;border-radius:12px;background:var(--sep);margin-bottom:12px;gap:2px;}
  .segmented button{flex:1;padding:7px 4px;border:none;border-radius:9px;background:transparent;font-size:13px;font-weight:500;color:var(--sub);font-family:inherit;}
  .segmented button.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .row-group{background:var(--card);border-radius:16px;overflow:hidden;}
  .tx-row, .asset-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:.5px solid var(--sep);min-height:60px;}
  .tx-row:last-child, .asset-row:last-child{border-bottom:none;}
  .tx-left, .asset-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:none;text-align:left;padding:0;font-family:inherit;}
  .tx-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tx-icon svg{width:15px;height:15px;}
  .row-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-right{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-left:8px;}
  .row-amount{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;}
  .del-btn{border:none;background:transparent;padding:6px;border-radius:50%;display:flex;}
  .del-btn svg{width:15px;height:15px;}
  .date-label{font-size:12px;font-weight:600;color:var(--sub);padding:0 4px;margin:14px 0 6px;}
  .empty{text-align:center;padding:56px 20px;color:var(--sub);}
  .empty p{margin:2px 0;font-size:14px;}
  .fab{position:fixed;right:max(20px, calc(50% - 210px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:28px;box-shadow:0 4px 14px rgba(0,122,255,.4);display:none;align-items:center;justify-content:center;z-index:30;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  #tabbar{position:fixed;left:50%;transform:translateX(-50%) translateZ(0);width:100%;max-width:480px;display:flex;background:var(--tabbar-bg);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,10px);backdrop-filter:blur(10px);transition:background-color .2s ease;will-change:transform;bottom:0;}
  .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;background:none;border:none;font-family:inherit;color:var(--faint);}
  .tab-btn svg{width:22px;height:22px;}
  .tab-btn span{font-size:10.5px;font-weight:500;}
  .tab-btn.active{color:var(--blue);}
  .tab-btn.active span{font-weight:600;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .sheet{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;}
  .sheet-handle{display:flex;justify-content:center;padding:10px 0 4px;}
  .sheet-handle div{width:36px;height:5px;border-radius:3px;background:var(--faint);}
  .sheet-head{padding:0 20px 16px;display:flex;align-items:center;justify-content:space-between;}
  .sheet-head button{background:none;border:none;color:var(--blue);font-size:14px;font-weight:500;font-family:inherit;}
  .sheet-head h2{font-size:16px;font-weight:600;margin:0;}
  .sheet-body{padding:0 16px calc(32px + env(safe-area-inset-bottom,0px));}
  .form-group{background:var(--card);border-radius:16px;margin-bottom:16px;overflow:hidden;}
  .form-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:46px;border-bottom:.5px solid var(--sep);gap:12px;}
  .form-row:last-child{border-bottom:none;}
  .form-row label{font-size:15px;flex-shrink:0;}
  .form-row input{flex:1;min-width:0;text-align:right;background:transparent;border:none;outline:none;color:var(--sub);font-size:15px;padding:10px 0;font-family:inherit;}
  .form-row select{
    flex:1;min-width:0;text-align:right;background-color:transparent;border:none;outline:none;
    color:var(--sub);font-size:15px;padding:10px 18px 10px 0;font-family:inherit;
    -webkit-appearance:none;-moz-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E8E93' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right center;background-size:14px;
  }
  .form-row input[type="date"]{flex:0 1 auto;margin-left:auto;max-width:62%;text-align:right;}
  .picker-row{display:flex;align-items:center;justify-content:space-between;padding:0 16px;min-height:46px;border-bottom:.5px solid var(--sep);background:none;border-left:none;border-right:none;border-top:none;width:100%;font-family:inherit;text-align:left;}
  .picker-row label{font-size:15px;color:var(--text);flex-shrink:0;pointer-events:none;}
  .picker-row .picker-value{display:flex;align-items:center;gap:5px;font-size:15px;color:var(--sub);min-width:0;}
  .picker-row .picker-value span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .picker-row .picker-value svg{width:13px;height:13px;flex-shrink:0;transition:transform .18s ease;}
  .picker-row.open .picker-value svg{transform:rotate(180deg);}
  .picker-scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0);}
  .picker-popover{
    position:fixed;z-index:100;overflow-y:auto;border-radius:14px;
    background:var(--picker-bg);
    -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
    box-shadow:0 16px 40px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.05);
    transform-origin:top center;
    animation:pickerIn .17s cubic-bezier(.22,.9,.32,1.1);
  }
  @keyframes pickerIn{ from{ opacity:0; transform:translateY(-6px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
  .picker-option{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:transparent;border:none;border-bottom:.5px solid var(--sep-translucent);font-family:inherit;font-size:15px;color:var(--text);text-align:left;}
  .picker-option:last-child{border-bottom:none;}
  .picker-option.selected{color:var(--blue);font-weight:600;}
  .picker-option svg{width:16px;height:16px;color:var(--blue);flex-shrink:0;}
  .picker-option:active{background:rgba(128,128,128,.14);}
  .hint{font-size:12px;color:var(--sub);padding:0 4px;margin:-8px 0 16px;}
  .hint.warn{color:var(--red);}
  .save-btn{width:100%;padding:14px;border-radius:16px;font-weight:600;font-size:15px;background:var(--blue);color:#fff;border:none;font-family:inherit;}
  .type-toggle{display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--sep);margin-bottom:16px;}
  .type-toggle button{flex:1;padding:10px 4px;border:none;border-radius:9px;font-weight:500;font-size:14px;font-family:inherit;background:transparent;color:var(--sub);}
  .type-toggle button.active-expense{background:var(--redBg);color:var(--red);}
  .type-toggle button.active-income{background:var(--greenBg);color:var(--green);}
  .type-toggle button.active-transfer{background:var(--blueBg);color:var(--blue);}
  canvas{width:100%;display:block;}
  .cat-header{display:flex;justify-content:space-between;padding:0 4px;margin-bottom:6px;}
  .cat-header span:first-child{font-size:12px;font-weight:600;color:var(--sub);}
  .cat-header span:last-child{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;}
  .progress-track{width:100%;height:6px;border-radius:3px;background:var(--sep);margin-top:4px;}
  .progress-fill{height:6px;border-radius:3px;}
  .loading{display:flex;align-items:center;justify-content:center;height:100vh;color:var(--sub);font-size:14px;flex-direction:column;gap:8px;}
  datalist{display:none;}
</style>
</head>
<body>
<div id="app">
  <header style="display:flex;align-items:center;justify-content:space-between;">
    <h1 id="pageTitle">Overview</h1>
    <div style="display:flex;gap:8px;">
      <button id="darkModeBtn" class="eye-btn"></button>
      <button id="hideBalanceBtn" class="eye-btn"></button>
    </div>
  </header>
  <div id="errorBanner" class="error-banner" style="display:none"></div>
  <main id="content"></main>
  <button id="fab" class="fab">+</button>
  <nav id="tabbar"></nav>
</div>
<div id="sheetOverlay" class="sheet-overlay"><div id="sheet" class="sheet"></div></div>
<div id="pickerOverlay" class="sheet-overlay" style="z-index:60;"><div id="picker" class="sheet"></div></div>
<input type="file" id="restoreFileInput" accept="application/json,.json" style="display:none">

<script>
/* ---------- storage ---------- */
const LS_TX = "ft_transactions", LS_ASSETS = "ft_assets";
let storageAvailable = true;
try{ localStorage.setItem("__test__","1"); localStorage.removeItem("__test__"); }catch(e){ storageAvailable = false; }
function loadTx(){ try{ return JSON.parse(localStorage.getItem(LS_TX)||"[]"); }catch(e){ return []; } }
function loadAssets(){ try{ return JSON.parse(localStorage.getItem(LS_ASSETS)||"[]"); }catch(e){ return []; } }
function saveTx(list){ transactions = list; try{ localStorage.setItem(LS_TX, JSON.stringify(list)); }catch(e){ flashError("Storage is blocked in this view — data won't be saved. Open this file in Safari directly."); } }
function saveAssets(list){ assets = list; try{ localStorage.setItem(LS_ASSETS, JSON.stringify(list)); }catch(e){ flashError("Storage is blocked in this view — data won't be saved. Open this file in Safari directly."); } }

let transactions = loadTx();
let assets = loadAssets();
let tab = "dashboard";
let period = "month";
let confirmDeleteId = null;
let hideBalance = false;
try{ hideBalance = localStorage.getItem("ft_hideBalance") === "1"; }catch(e){}
function toggleHideBalance(){
  hideBalance = !hideBalance;
  try{ localStorage.setItem("ft_hideBalance", hideBalance ? "1" : "0"); }catch(e){}
  render();
}
let darkMode = false;
try{
  const stored = localStorage.getItem("ft_darkMode");
  darkMode = stored !== null ? stored === "1" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}catch(e){}
function applyDarkMode(){ document.documentElement.classList.toggle("dark", darkMode); }
function toggleDarkMode(){
  darkMode = !darkMode;
  try{ localStorage.setItem("ft_darkMode", darkMode ? "1" : "0"); }catch(e){}
  applyDarkMode();
  render();
}
applyDarkMode();
let confirmTimer = null;
let editingTx = null;
let editingAsset = null;

/* ---------- constants ---------- */
const TX_CATEGORIES = {
  income: ["Salary","Bonus","Interest","Freelance","Other"],
  expense: ["Food","Transport","Shopping","Bills","Entertainment","Health","Other"],
};
const ASSET_CATEGORIES = ["Bank","Cash"];
const ASSET_COLOR = { Bank:"var(--blue)", Cash:"var(--green)" };

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){ const d=new Date(); const l=new Date(d.getTime()-d.getTimezoneOffset()*60000); return l.toISOString().slice(0,10); }
function esc(s){ const d=document.createElement("div"); d.textContent = s==null? "": String(s); return d.innerHTML; }
function formatRp(n){ const v=Number(n)||0; const sign=v<0?"-":""; return sign+"Rp"+Math.round(Math.abs(v)).toLocaleString("en-US"); }
function formatRpShort(n){ const v=Number(n)||0; const abs=Math.abs(v); const sign=v<0?"-":"";
  if(abs>=1e9) return sign+"Rp"+(abs/1e9).toFixed(1).replace(/\.0$/,"")+"B";
  if(abs>=1e6) return sign+"Rp"+(abs/1e6).toFixed(1).replace(/\.0$/,"")+"M";
  if(abs>=1e3) return sign+"Rp"+(abs/1e3).toFixed(0)+"K";
  return formatRp(v);
}
function formatThousands(digits){ if(!digits) return ""; return Number(digits).toLocaleString("en-US"); }
function displayRp(n){ return hideBalance ? "Rp••••••" : formatRp(n); }
function displayRpShort(n){ return hideBalance ? "Rp•••" : formatRpShort(n); }
function onlyDigits(s){ return (s||"").replace(/\D/g,""); }
function dateLabel(dateStr){ try{ return new Date(dateStr+"T00:00:00").toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }catch(e){ return dateStr; } }
function monthLabel(key){ const [y,m]=key.split("-"); return new Date(Number(y),Number(m)-1,1).toLocaleDateString("en-US",{month:"short"}); }
function last6MonthKeys(){ const arr=[]; const now=new Date(); for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); arr.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); } return arr; }
function flashError(msg, kind){
  const b=document.getElementById("errorBanner");
  b.textContent = msg;
  b.style.background = kind==="success" ? "var(--greenBg)" : "var(--redBg)";
  b.style.color = kind==="success" ? "var(--green)" : "var(--red)";
  b.style.display="flex";
  clearTimeout(flashError._t); flashError._t=setTimeout(()=>{ b.style.display="none"; }, 3000);
}

/* ---------- icons (inline svg) ---------- */
const ICONS = {
  wallet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1"/><path d="M18 12a2 2 0 0 0 0 4h3v-4Z"/></svg>`,
  chart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>`,
  bank: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 18 0"/><path d="M3 10h18L12 3Z"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8"/></svg>`,
  up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>`,
  down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 9v8h8"/></svg>`,
  trendUp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>`,
  alert: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>`,
  chevronDown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`,
  check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>`,
  eye: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeOff: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M6.6 6.6C3.4 8.5 1 12 1 12s4 8 11 8a9.3 9.3 0 0 0 5.4-1.6"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M1 1l22 22"/></svg>`,
  transfer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,

/* ---------- financial logic ---------- */
function adjustAsset(list, accountId, delta){
  if(!accountId || !delta) return list;
  return list.map(a => a.id===accountId ? {...a, amount: a.amount+delta} : a);
}
function reverseEffect(list, tx){
  if(!tx) return list;
  if(tx.type==="transfer"){
    let next = adjustAsset(list, tx.fromAccountId, tx.amount);
    next = adjustAsset(next, tx.toAccountId, -tx.amount);
    return next;
  }
  if(tx.accountId){
    const delta = tx.type==="income" ? tx.amount : -tx.amount;
    return adjustAsset(list, tx.accountId, -delta);
  }
  return list;
}
function applyEffect(list, tx){
  if(tx.type==="transfer"){
    let next = adjustAsset(list, tx.fromAccountId, -tx.amount);
    next = adjustAsset(next, tx.toAccountId, tx.amount);
    return next;
  }
  if(tx.accountId){
    const delta = tx.type==="income" ? tx.amount : -tx.amount;
    return adjustAsset(list, tx.accountId, delta);
  }
  return list;
}
function upsertTx(draft){
  const amt = Math.abs(Number(draft.amount))||0;
  if(draft.type==="transfer"){
    if(!draft.date || !draft.fromAccountId || !draft.toAccountId || draft.fromAccountId===draft.toAccountId || amt<=0){
      flashError("Please fill in date, amount, and two different accounts.");
      return;
    }
  } else {
    if(!draft.date || !draft.category || amt<=0 || !draft.accountId){
      flashError("Please fill in date, category, amount, and select an account.");
      return;
    }
  }
  let nextAssets = reverseEffect(assets, editingTx);
  const finalTxBase = draft.type==="transfer"
    ? { type:"transfer", date:draft.date, fromAccountId:draft.fromAccountId, toAccountId:draft.toAccountId, amount:amt, note:(draft.note||"").trim() }
    : { type:draft.type, date:draft.date, category:(draft.category||"").trim(), amount:amt, note:(draft.note||"").trim(), accountId:draft.accountId||null };
  nextAssets = applyEffect(nextAssets, finalTxBase);
  if(nextAssets !== assets) saveAssets(nextAssets);
  const finalTx = { ...finalTxBase, id: editingTx ? editingTx.id : uid() };
  if(editingTx) saveTx(transactions.map(t => t.id===editingTx.id ? finalTx : t));
  else saveTx([...transactions, finalTx]);
  closeSheet(); render();
}
function deleteTx(id){
  const tx = transactions.find(t => t.id===id);
  if(tx) saveAssets(reverseEffect(assets, tx));
  saveTx(transactions.filter(t => t.id!==id));
  render();
}
function upsertAsset(draft){
  const amt = Number(draft.amount)||0;
  if(!draft.category || !draft.name || amt<0){ flashError("Please fill in category, name, and value."); return; }
  if(editingAsset) saveAssets(assets.map(a => a.id===editingAsset.id ? {...draft, amount:amt} : a));
  else saveAssets([...assets, {...draft, amount:amt, id:uid()}]);
  closeSheet(); render();
}
function deleteAsset(id){ saveAssets(assets.filter(a => a.id!==id)); render(); }

function handleConfirmDelete(id, kind){
  if(confirmDeleteId === id){
    if(kind==="tx") deleteTx(id); else deleteAsset(id);
    confirmDeleteId = null; clearTimeout(confirmTimer);
  } else {
    confirmDeleteId = id; clearTimeout(confirmTimer);
    confirmTimer = setTimeout(()=>{ confirmDeleteId=null; render(); }, 2500);
    render();
  }
}

/* ---------- derived data ---------- */
function getFilteredTx(){
  const today = todayStr(); const curMonth = today.slice(0,7); const curYear = today.slice(0,4);
  let list = transactions;
  if(period==="day") list = list.filter(t => t.date===today);
  else if(period==="month") list = list.filter(t => t.date.slice(0,7)===curMonth);
  else if(period==="year") list = list.filter(t => t.date.slice(0,4)===curYear);
  return [...list].reverse().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
}
function getAssetTotals(){
  const byCat = {}; ASSET_CATEGORIES.forEach(c=> byCat[c]=0);
  let total = 0;
  assets.forEach(a=>{ byCat[a.category]=(byCat[a.category]||0)+a.amount; total+=a.amount; });
  return { byCat, total };
}
function getMonthNet(){
  const curMonth = todayStr().slice(0,7);
  let income=0, expense=0;
  transactions.forEach(t=>{ if(t.date.slice(0,7)===curMonth){ if(t.type==="income") income+=t.amount; else if(t.type==="expense") expense+=t.amount; } });
  return income-expense;
}
function getMonthChartData(){
  const keys = last6MonthKeys();
  return keys.map(k=>{
    let income=0, expense=0;
    transactions.forEach(t=>{ if(t.date.slice(0,7)===k){ if(t.type==="income") income+=t.amount; else if(t.type==="expense") expense+=t.amount; } });
    return { month: monthLabel(k), income, expense };
  });
}

function drawChart(){
  const canvas = document.getElementById("chartCanvas");
  if(!canvas) return;
  const data = getMonthChartData();
  const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const colGreen = cv("--green"), colRed = cv("--red"), colSub = cv("--sub");
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth || 300, h = 160;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  const max = Math.max(1, ...data.map(d=>Math.max(d.income,d.expense)));
  const padBottom = 20, padTop = 6, chartH = h-padBottom-padTop;
  const groupW = w/data.length;
  ctx.font = "11px -apple-system,sans-serif"; ctx.fillStyle = colSub; ctx.textAlign="center";
  data.forEach((d,i)=>{
    const cx = groupW*i + groupW/2;
    const bw = Math.min(14, groupW*0.22);
    const gap = 4;
    const incH = (d.income/max)*chartH, expH = (d.expense/max)*chartH;
    ctx.fillStyle = colGreen;
    ctx.beginPath(); roundRectTop(ctx, cx-bw-gap/2, padTop+chartH-incH, bw, incH, 3); ctx.fill();
    ctx.fillStyle = colRed;
    ctx.beginPath(); roundRectTop(ctx, cx+gap/2, padTop+chartH-expH, bw, expH, 3); ctx.fill();
    ctx.fillStyle = colSub;
    ctx.fillText(d.month, cx, h-4);
  });
}
function roundRectTop(ctx,x,y,w,h,r){
  if(h<=0){ return; }
  const rr = Math.min(r, w/2, h);
  ctx.moveTo(x, y+h);
  ctx.lineTo(x, y+rr);
  ctx.arcTo(x, y, x+rr, y, rr);
  ctx.lineTo(x+w-rr, y);
  ctx.arcTo(x+w, y, x+w, y+rr, rr);
  ctx.lineTo(x+w, y+h);
  ctx.closePath();
}

function getAvailableMonths(){
  const set = new Set(transactions.map(t => t.date.slice(0,7)));
  set.add(todayStr().slice(0,7));
  return [...set].sort((a,b)=> a<b?1:-1);
}
function csvEscape(v){
  const s = String(v==null?"":v);
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function formatDayMonth(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.getDate()+"-"+d.toLocaleDateString("en-US",{month:"short"});
}
function fullMonthName(monthKey){
  const [y,m] = monthKey.split("-");
  return new Date(Number(y),Number(m)-1,1).toLocaleDateString("en-US",{month:"long"});
}
function exportBackupJSON(){
  const payload = { app:"finance-tracker", version:1, exportedAt:new Date().toISOString(), transactions, assets };
  const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `finance-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  flashError("Backup downloaded.", "success");
}
function triggerRestoreFile(){ document.getElementById("restoreFileInput").click(); }
function handleRestoreFile(e){
  const file = e.target.files[0];
  e.target.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ flashError("This file isn't valid JSON."); return; }
    if(!data || !Array.isArray(data.transactions) || !Array.isArray(data.assets)){
      flashError("This doesn't look like a valid backup file.");
      return;
    }
    const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : "an unknown date";
    const ok = confirm(`This will replace ALL current data with the backup from ${when} (${data.transactions.length} transactions, ${data.assets.length} accounts). This can't be undone. Continue?`);
    if(!ok) return;
    saveTx(data.transactions);
    saveAssets(data.assets);
    render();
    flashError("Backup restored.", "success");
  };
  reader.onerror = () => flashError("Couldn't read that file.");
  reader.readAsText(file);
}

function exportMonthCSV(monthKey){
  const assetMap = Object.fromEntries(assets.map(a=>[a.id,a]));
  const rows = transactions
    .filter(t => t.date.slice(0,7)===monthKey)
    .sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  let income=0, expense=0;
  const lines = [`DAILY CASHFLOW - ${fullMonthName(monthKey)} ${monthKey.slice(0,4)}`, ""];
  lines.push(["Date","Description","Bank","Credit","Debit"].map(csvEscape).join(";"));
  rows.forEach(t=>{
    const dateStr = formatDayMonth(t.date);
    if(t.type==="transfer"){
      const from = assetMap[t.fromAccountId], to = assetMap[t.toAccountId];
      income += t.amount; expense += t.amount;
      lines.push([dateStr, `Transfer to ${to?to.name:"?"}`, from?from.name:"", "", t.amount].map(csvEscape).join(";"));
      lines.push([dateStr, `Transfer from ${from?from.name:"?"}`, to?to.name:"", t.amount, ""].map(csvEscape).join(";"));
      return;
    }
    if(t.type==="income") income+=t.amount; else expense+=t.amount;
    const desc = t.note || t.category;
    const bank = assetMap[t.accountId] ? assetMap[t.accountId].name : "";
    const credit = t.type==="income" ? t.amount : "";
    const debit = t.type==="expense" ? t.amount : "";
    lines.push([dateStr, desc, bank, credit, debit].map(csvEscape).join(";"));
  });
  lines.push("");
  lines.push(["","","Total",income,expense].map(csvEscape).join(";"));
  lines.push(["","","Net","",income-expense].map(csvEscape).join(";"));

  const blob = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `cashflow-${monthKey}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderAssets(){

  const groupedAssets = {}; ASSET_CATEGORIES.forEach(c=> groupedAssets[c]=[]);
  assets.forEach(a=> (groupedAssets[a.category]=groupedAssets[a.category]||[]).push(a));
  const hasAny = assets.length>0;

  let html = `<div class="hero"><div class="label">Total Balance</div><div class="amount" style="font-size:30px;">${displayRp(total)}</div></div>`;

  if(!hasAny){
    html += `<div class="empty"><p>No accounts added yet.</p><p>Tap + to add a bank or cash balance.</p></div>`;
  }

  ASSET_CATEGORIES.forEach(cat=>{
    const items = groupedAssets[cat];
    if(!items.length) return;
    html += `<div class="cat-header"><span>${cat.toUpperCase()}</span><span style="color:${ASSET_COLOR[cat]}">${displayRp(byCat[cat])}</span></div><div class="row-group" style="margin-bottom:12px;">`;
    items.forEach(a=>{
      html += `<div class="asset-row">
        <button class="asset-left" data-edit-asset="${a.id}">
          <span style="width:8px;height:8px;border-radius:50%;background:${ASSET_COLOR[cat]};flex-shrink:0;"></span>
          <span style="min-width:0;">
            <div class="row-title">${esc(a.name)}</div>
            ${a.note?`<div class="row-sub">${esc(a.note)}</div>`:""}
          </span>
        </button>
        <div class="row-right">
          <span class="row-amount">${displayRp(a.amount)}</span>
          <button class="del-btn" data-del-asset="${a.id}" style="background:${confirmDeleteId===a.id?'var(--redBg)':'transparent'}"><span style="color:${confirmDeleteId===a.id?'var(--red)':'var(--faint)'}">${ICONS.trash}</span></button>
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<div class="card" style="margin-top:4px;">
    <div style="font-size:15px;font-weight:600;margin-bottom:4px;">Backup & Restore</div>
    <p class="subtle" style="margin:0 0 12px;">Save a full copy of all your transactions and accounts, or restore from a previous backup.</p>
    <div style="display:flex;gap:8px;">
      <button id="exportBackupBtn" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;border-radius:12px;border:none;background:var(--blueBg);color:var(--blue);font-size:14px;font-weight:600;font-family:inherit;">
        <span style="width:15px;height:15px;display:flex;">${ICONS.download}</span> Backup
      </button>
      <button id="restoreBackupBtn" style="flex:1;padding:11px 8px;border-radius:12px;border:none;background:var(--sep);color:var(--text);font-size:14px;font-weight:600;font-family:inherit;">
        Restore
      </button>
    </div>
  </div>`;
  return html;
}

/* ---------- content event delegation ---------- */
function attachContentHandlers(){
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.onclick = openExportSheet;
  const exportBackupBtn = document.getElementById("exportBackupBtn");
  if(exportBackupBtn) exportBackupBtn.onclick = exportBackupJSON;
  const restoreBackupBtn = document.getElementById("restoreBackupBtn");
  if(restoreBackupBtn) restoreBackupBtn.onclick = triggerRestoreFile;
  document.querySelectorAll("[data-period]").forEach(btn=>{
    btn.onclick = () => { period = btn.getAttribute("data-period"); render(); };
  });
  document.querySelectorAll("[data-edit-tx]").forEach(btn=>{
    btn.onclick = () => { const id=btn.getAttribute("data-edit-tx"); openTxSheet(transactions.find(t=>t.id===id)); };
  });
  document.querySelectorAll("[data-del-tx]").forEach(btn=>{
    btn.onclick = (e) => { e.stopPropagation(); handleConfirmDelete(btn.getAttribute("data-del-tx"), "tx"); };
  });
  document.querySelectorAll("[data-edit-asset]").forEach(btn=>{
    btn.onclick = () => { const id=btn.getAttribute("data-edit-asset"); openAssetSheet(assets.find(a=>a.id===id)); };
  });
  document.querySelectorAll("[data-del-asset]").forEach(btn=>{
    btn.onclick = (e) => { e.stopPropagation(); handleConfirmDelete(btn.getAttribute("data-del-asset"), "asset"); };
  });
}

/* ---------- sheets ---------- */
function closeSheet(){
  document.getElementById("sheetOverlay").style.display = "none";
  removePickerPopover();
  editingTx = null; editingAsset = null;
}
function renderPickerTrigger(key, label, displayValue, placeholder, openKey, last){
  const isOpen = openKey === key;
  const hasValue = !!displayValue;
  return `
    <button type="button" class="picker-row ${isOpen?'open':''}" data-picker-toggle="${key}" style="${last?'border-bottom:none;':''}">
      <label>${label}</label>
      <span class="picker-value" style="${!hasValue?'color:var(--faint);':''}">
        <span>${esc(hasValue?displayValue:placeholder)}</span>
        ${ICONS.chevronDown}
      </span>
    </button>`;
}
function removePickerPopover(){
  document.querySelectorAll(".picker-popover, .picker-scrim").forEach(el => el.remove());
}
function mountPickerPopover(state, key, options, rerender){
  removePickerPopover();
  if(state.openPicker !== key) return;
  const trigger = document.querySelector(`[data-picker-toggle="${key}"]`);
  if(!trigger) return;
  const rect = trigger.getBoundingClientRect();
  const available = window.innerHeight - rect.bottom - 20;

  const scrim = document.createElement("div");
  scrim.className = "picker-scrim";
  scrim.onclick = () => { state.openPicker = null; rerender(state); };

  const pop = document.createElement("div");
  pop.className = "picker-popover";
  pop.style.top = (rect.bottom + 6) + "px";
  pop.style.left = rect.left + "px";
  pop.style.width = rect.width + "px";
  pop.style.maxHeight = Math.max(120, Math.min(260, available)) + "px";
  pop.innerHTML = options.map(opt => `
    <button type="button" class="picker-option ${opt.selected?'selected':''}" data-picker-value="${esc(opt.value)}">
      <span>${esc(opt.label)}</span>${opt.selected?ICONS.check:""}
    </button>`).join("");
  pop.querySelectorAll("[data-picker-value]").forEach(btn=>{
    btn.onclick = (e) => {
      e.stopPropagation();
      state.onPick(key, btn.getAttribute("data-picker-value"));
      state.openPicker = null;
      rerender(state);
    };
  });
  document.body.appendChild(scrim);
  document.body.appendChild(pop);
}
function attachPickerToggles(sheet, state, rerender){
  sheet.querySelectorAll("[data-picker-toggle]").forEach(btn=>{
    btn.onclick = () => {
      const key = btn.getAttribute("data-picker-toggle");
      state.openPicker = state.openPicker===key ? null : key;
      rerender(state);
    };
  });
}

function openTxSheet(tx){
  editingTx = tx || null;
  const type0 = tx?.type || "expense";
  const state = {
    type:type0, date: tx?.date||todayStr(), category: tx?.category||"",
    amount: tx?tString(tx.amount):"", note: tx?.note||"",
    accountId: tx?.accountId||"",
    fromAccountId: tx?.fromAccountId||"", toAccountId: tx?.toAccountId||"",
    openPicker: null,
  };
  renderTxSheet(state);
  document.getElementById("sheetOverlay").style.display = "flex";
}
function tString(n){ return n?String(n):""; }

function renderTxSheet(state){
  const sortedAssets = [...assets].sort((a,b)=> a.category===b.category ? a.name.localeCompare(b.name) : (a.category==="Bank"?-1:1));
  const selected = sortedAssets.find(a=>a.id===state.accountId);
  const isTransfer = state.type==="transfer";
  const sheet = document.getElementById("sheet");
  const openKey = state.openPicker;

  state.onPick = (key, val) => {
    if(key==="category") state.category = val;
    else if(key==="account") state.accountId = val;
    else if(key==="from"){ state.fromAccountId = val; if(state.toAccountId===val) state.toAccountId=""; }
    else if(key==="to") state.toAccountId = val;
  };

  let accountFieldsHtml, fromOptions=[], toOptions=[], accOptions=[];
  if(isTransfer){
    const fromAcc = sortedAssets.find(a=>a.id===state.fromAccountId);
    const toAcc = sortedAssets.find(a=>a.id===state.toAccountId);
    fromOptions = sortedAssets.map(a=>({ value:a.id, label:`${a.name} (${a.category})`, selected:a.id===state.fromAccountId }));
    toOptions = sortedAssets.filter(a=>a.id!==state.fromAccountId).map(a=>({ value:a.id, label:`${a.name} (${a.category})`, selected:a.id===state.toAccountId }));
    accountFieldsHtml = `
      <div class="form-group">
        ${renderPickerTrigger("from","From", fromAcc?`${fromAcc.name} (${fromAcc.category})`:"", "Select account", openKey, false)}
        ${renderPickerTrigger("to","To", toAcc?`${toAcc.name} (${toAcc.category})`:"", "Select account", openKey, true)}
      </div>
      ${sortedAssets.length<2
        ? `<p class="hint warn">You need at least 2 accounts in the Accounts tab to make a transfer.</p>`
        : `<p class="hint"></p>`}
    `;
  } else {
    accOptions = sortedAssets.map(a=>({ value:a.id, label:`${a.name} (${a.category})`, selected:a.id===state.accountId }));
    accountFieldsHtml = `
      <div class="form-group">
        ${renderPickerTrigger("account","Account", selected?`${selected.name} (${selected.category})`:"", "Select account", openKey, true)}
      </div>
      ${sortedAssets.length===0
        ? `<p class="hint warn">Add an account in the Accounts tab first — a transaction must be linked to one.</p>`
        : (selected ? `<p class="hint">The ${esc(selected.name)} balance will automatically ${state.type==='income'?'increase':'decrease'} by this amount.</p>` : `<p class="hint"></p>`)}
    `;
  }

  const catOptions = isTransfer ? [] : TX_CATEGORIES[state.type].map(c=>({ value:c, label:c, selected:c===state.category }));

  sheet.innerHTML = `
    <div class="sheet-handle"><div></div></div>
    <div class="sheet-head"><button id="cancelBtn">Cancel</button><h2>${editingTx?"Edit Transaction":"New Transaction"}</h2><div style="width:40px;"></div></div>
    <div class="sheet-body">
      <div class="type-toggle">
        <button id="btnExpense" class="${state.type==='expense'?'active-expense':''}">Expense</button>
        <button id="btnIncome" class="${state.type==='income'?'active-income':''}">Income</button>
        <button id="btnTransfer" class="${state.type==='transfer'?'active-transfer':''}">Transfer</button>
      </div>
      <div class="form-group">
        <div class="form-row"><label>Date</label><input type="date" id="fDate" value="${state.date}"></div>
        ${isTransfer ? "" : renderPickerTrigger("category","Category", state.category, "Select category", openKey, false)}
        <div class="form-row"><label>Amount</label><input type="text" inputmode="numeric" id="fAmount" placeholder="0" value="${formatThousands(state.amount)}"></div>
        <div class="form-row" style="border-bottom:none;"><label>Note</label><input type="text" id="fNote" placeholder="Optional" value="${esc(state.note)}"></div>
      </div>
      ${accountFieldsHtml}
      <button class="save-btn" id="saveTxBtn">Save</button>
    </div>
  `;
  document.getElementById("cancelBtn").onclick = closeSheet;
  document.getElementById("btnExpense").onclick = () => { state.type="expense"; state.category=""; state.openPicker=null; renderTxSheet(state); };
  document.getElementById("btnIncome").onclick = () => { state.type="income"; state.category=""; state.openPicker=null; renderTxSheet(state); };
  document.getElementById("btnTransfer").onclick = () => { state.type="transfer"; state.openPicker=null; renderTxSheet(state); };
  document.getElementById("fDate").oninput = e => state.date = e.target.value;
  document.getElementById("fNote").oninput = e => state.note = e.target.value;
  const amountEl = document.getElementById("fAmount");
  amountEl.oninput = e => { state.amount = onlyDigits(e.target.value); e.target.value = formatThousands(state.amount); };
  attachPickerToggles(sheet, state, renderTxSheet);
  const pickerOptionsMap = { category:catOptions, account:accOptions, from:fromOptions, to:toOptions };
  mountPickerPopover(state, state.openPicker, pickerOptionsMap[state.openPicker]||[], renderTxSheet);
  document.getElementById("saveTxBtn").onclick = () => upsertTx({
    id: editingTx?editingTx.id:undefined, type:state.type, date:state.date,
    category:state.category, amount:state.amount, note:state.note,
    accountId: state.accountId||null,
    fromAccountId: state.fromAccountId||null, toAccountId: state.toAccountId||null,
  });
}

function openAssetSheet(asset){
  editingAsset = asset || null;
  const state = { category: asset?.category||"Bank", name: asset?.name||"", amount: asset?tString(asset.amount):"", note: asset?.note||"", openPicker: null };
  renderAssetSheet(state);
  document.getElementById("sheetOverlay").style.display = "flex";
}
function renderAssetSheet(state){
  const placeholders = { Bank:"e.g. BCA", Cash:"e.g. Cash on hand" };
  const sheet = document.getElementById("sheet");
  const openKey = state.openPicker;
  state.onPick = (key, val) => { if(key==="assetType") state.category = val; };
  const typeOptions = ASSET_CATEGORIES.map(c=>({ value:c, label:c, selected:c===state.category }));

  sheet.innerHTML = `
    <div class="sheet-handle"><div></div></div>
    <div class="sheet-head"><button id="cancelBtn">Cancel</button><h2>${editingAsset?"Edit Account":"New Account"}</h2><div style="width:40px;"></div></div>
    <div class="sheet-body">
      <div class="form-group">
        ${renderPickerTrigger("assetType","Type", state.category, "", openKey, false)}
        <div class="form-row"><label>Name</label><input type="text" id="aName" placeholder="${placeholders[state.category]}" value="${esc(state.name)}"></div>
        <div class="form-row"><label>Balance</label><input type="text" inputmode="numeric" id="aAmount" placeholder="0" value="${formatThousands(state.amount)}"></div>
        <div class="form-row" style="border-bottom:none;"><label>Note</label><input type="text" id="aNote" placeholder="Optional" value="${esc(state.note)}"></div>
      </div>
      <button class="save-btn" id="saveAssetBtn">Save</button>
    </div>
  `;
  document.getElementById("cancelBtn").onclick = closeSheet;
  document.getElementById("aName").oninput = e => state.name = e.target.value;
  document.getElementById("aNote").oninput = e => state.note = e.target.value;
  document.getElementById("aAmount").oninput = e => { state.amount = onlyDigits(e.target.value); e.target.value = formatThousands(state.amount); };
  attachPickerToggles(sheet, state, renderAssetSheet);
  mountPickerPopover(state, "assetType", typeOptions, renderAssetSheet);
  document.getElementById("saveAssetBtn").onclick = () => upsertAsset({ id: editingAsset?editingAsset.id:undefined, category:state.category, name:state.name.trim(), amount:state.amount, note:state.note.trim() });
}

/* ---------- boot ---------- */
document.getElementById("restoreFileInput").addEventListener("change", handleRestoreFile);
document.getElementById("sheetOverlay").addEventListener("click", (e) => {
  if(e.target === e.currentTarget) closeSheet();
});
window.onerror = function(msg, src, line, col, err){
  document.getElementById("content").innerHTML =
    `<div class="card" style="margin-top:16px;"><div style="font-weight:600;margin-bottom:6px;">Something went wrong</div><div class="subtle" style="word-break:break-word;">${esc(msg)} (line ${line})</div></div>`;
  return true;
};
try{
  if(!storageAvailable) flashError("Storage is blocked in this view. Open this file directly in Safari (not a preview) so your data can be saved.");
  render();
}catch(e){
  document.getElementById("content").innerHTML =
    `<div class="card" style="margin-top:16px;"><div style="font-weight:600;margin-bottom:6px;">Something went wrong</div><div class="subtle" style="word-break:break-word;">${esc(e.message)}</div></div>`;
}
</script>
</body>
</html>
